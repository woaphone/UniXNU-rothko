components = ["SoftwareAES", "RamBlock", "AppleKeyStoreState", "VerifiedRoot", "NativeMtkUfs", "NativeAES", "NativeRamBlock"]
paths = ["drivers/NativeMtkUfs/**", "drivers/NativeAES/**", "drivers/NativeRamBlock/**", "drivers/NativeKeyStoreEvents/**", "board.toml", "package/**"]
inputs = ["MT6989 UFS host at 0x112b0000, UFS4 device, LU2 4096-byte user blocks, HS-G5 dual-lane XNU path, GPT unixnu window and root UUID.", "OS/SystemOS readonly windows, Data seed and the explicit distinction between XNU reads and UEFI BlockIO ownership."]
configuration = ["board.toml records the unixnu GPT LBA range, 4096-byte blocks, root-match UUID and readonly OS/SystemOS windows.", "NativeMtkUfs and NativeAES are included as separate XNU services; the UEFI repository is separately audited for refclk/reset/PHY writes."]
procedure = ["Build the UFS/AES/RamBlock archives, prelink the kernel and capture link, lane, capacity, GPT, root-match and read markers.", "Keep all persistence writes inside the declared unixnu Data/Log windows and review UEFI writes independently."]
findings = ["Device evidence showed XNU UFS HS-G5 dual-lane reads, LU2 activity, root matching and sustained reads.", "The later UEFI/BROM incident is not attributed to a proven LUN0 write; the firmware-side refclk/reset/PHY audit remains separate from this XNU evidence.", "The board firmware contract now points to the published ChallengeThePeak/Silicium-Rothko unx18 read-only UFS baseline."]
completion = ["Host/link/read/root/persistence boundaries match the board inventory and no write path escapes the declared unixnu windows."]
limits = ["Long-term UFS persistence and the BROM cause are unresolved; this record does not claim that the UEFI is safe to run again."]
next_action = ["After device recovery, run a read-first UFS capture with the reviewed UEFI safety revision and record the exact firmware and image hashes."]
evidence = [
  { kind = "source", reference = "drivers/NativeMtkUfs/NativeMtkUfs.cpp", result = "MT6989 UFS host and readonly media implementation are present." },
  { kind = "device", reference = "docs/verification.md", command = "pull pmsg and inspect UFS link, LU2 reads, GPT and root-match markers", revision = "d8def1ff64f9259a83cd37154eb5589a77dbb2f7", result = "HS-G5 dual-lane reads and root matching were observed in the unx16 follow-up evidence." },
]

