schema_version = 1

[device]
name = "rothko"
soc = "MT6989"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Redmi K70 Ultra (MT6989) UniXNU port. Device testing reached the activation page with UFS HS-G5 root access, active CMD display presentation, Goodix/HID activity and eight-core SMP; touch interaction, key wake, Wi-Fi, Bluetooth, battery and stable post-activation behavior remain open."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "XnuPrelink"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", "patches/xnu/series", "unixnu.lock"]
inputs = ["MT6989 / Dimensity 9300 board identity, eight CPUs, 13 MHz timer, GICv3 and the iPadOS 17.7.11 / 21H461 donor profile.", "Stock effective DT, board partition geometry and the reviewed component and patch inputs."]
configuration = ["board.toml selects the rothko board, mt6989-local source, ipados-17.7.11-21H461 profile and device:dts/rothko.dts.", "rothko_defconfig and patches/xnu/series select the kernel configuration and ordered XNU changes.", "unixnu.lock pins woaphone/xnu-mtk branch rothko, immutable patch base 53bc420e5acda41c1689f6690a85841393a347cf and final fd4edc747395525a914987bb88f063b5e549ecc7."]
procedure = ["Run unixnu defconfig rothko_defconfig -D ../UniXNU-rothko.", "Run unixnu fetch, unixnu status --json and unixnu tree, then run scripts/porting-record.py check."]
findings = ["The device repository is a format 2 board repository with a separate firmware repository; the MT6989 platform source is still device-local and is recorded as mt6989-local.", "The board firmware pin resolves to ChallengeThePeak/Silicium-Rothko and its rothkoPkg build entry.", "The XNU source now explicitly overrides the default Apple feed with woaphone/xnu-mtk branch rothko at fd4edc747395525a914987bb88f063b5e549ecc7.", "The 18-patch XNU series applies cleanly to the rothko XNU base through fd4edc747395525a914987bb88f063b5e549ecc7."]
completion = ["The board identity, OS profile, source pins, defconfig, DTS entry point and patch order resolve without placeholders."]
limits = ["A reusable public UniXNU-mt6989-common repository has not been split out yet; feeds.toml records the current local source honestly."]
next_action = ["Extract the common MT6989 platform source into a separately pinned repository before claiming a public SoC feed."]
evidence = [
  { kind = "source", reference = "board.toml", result = "Format 2 board identity and source contract are present." },
  { kind = "host", reference = "docs/verification.md", command = "unixnu defconfig; unixnu fetch; unixnu status --json; unixnu tree; porting-record.py check", revision = "d8def1ff64f9259a83cd37154eb5589a77dbb2f7", result = "The local repository and official record structure were reviewed." },
]

[[area]]
id = "firmware"
status = "host-verified"
components = ["DarwinBoot"]
paths = ["board.toml", "proprietary-files.txt", "package/**", "local.toml.example"]
inputs = ["Separate ChallengeThePeak/Silicium-Rothko firmware repository, rothko DSC/FD paths, DarwinBoot handoff, GOP framebuffer and 56 MiB payload FAT volume.", "UEFI device reset, PHY, refclk and BlockIO state are treated as firmware-owned and audited separately from XNU."]
configuration = ["board.toml records the UEFI checkout, rothko.dsc, SILICIUM_UEFI.fd path and firmware defines.", "The XNU payload uses firmware loader handoff, 8 GiB owned-memory intent and PSCI SMC."]
procedure = ["Build UEFI through the official DeviceBuild.py and stuart path in the UEFI checkout.", "Build the payload and boot image with the official UniXNU tools after the firmware FD is available."]
findings = ["Official UEFI builds completed offline and the device reached the Darwin handoff; UFS link/DP success and later NOP/descriptor issues were observed in separate captures.", "The unx17 BROM incident is recorded as unresolved; this device repository does not claim that LUN0 was written or that the current UEFI is safe for another hardware run."]
completion = ["A reviewed firmware revision builds, enters DarwinBoot, publishes the documented framebuffer and preserves the handoff memory contract."]
limits = ["The UEFI source and current unx18 safety candidate live in the separate ChallengeThePeak/Silicium-Rothko repository; current firmware runtime closure and the BROM cause remain open."]
next_action = ["Publish a reviewed UEFI revision or link a private CI result before marking firmware device-verified."]
evidence = [
  { kind = "source", reference = "board.toml", result = "Private firmware repository, DSC, FD and package contract are recorded." },
  { kind = "host", reference = "docs/verification.md", command = "DeviceBuild.py; stuart; official payload and boot_v4 packaging", revision = "d8def1ff64f9259a83cd37154eb5589a77dbb2f7", result = "The official UEFI and image build chain completed in the offline bring-up workspace." },
]

[[area]]
id = "cpu"
status = "device-verified"
components = ["ArmCpu", "MtkCpuFreq"]
paths = ["drivers/ArmCpu/**", "drivers/MtkCpuFreq/**", "dts/rothko.dts"]
inputs = ["Eight MT6989 CPUs, GICv3, 13 MHz timer, PSCI SMC, self-IPI and MMIO-IPI paths.", "The stock FDVFS interface and effective DT CPU vote table for the fixed boot-frequency request."]
configuration = ["payload kernel_args enables cpus=8, sheng-smp, armcpu-self-ipi and armcpu-mmio-ipi.", "The board DTS records cpu-count=8 and timebase-frequency=13000000."]
procedure = ["Build ArmCpu and MtkCpuFreq archives, link the kernel and capture K1-K4, timer and IPI markers from pmsg.", "Compare the fixed FDVFS request path with the stock DT and firmware table."]
findings = ["All eight CPU startup, timer and IPI activity were observed on the device.", "MtkCpuFreq is a fixed boot request; it is not a dynamic governor and no XNU-side frequency measurement proves that it resolves the reported system slowness."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works; any frequency claim must include a measured runtime frequency."]
limits = ["Dynamic cpufreq/governor behavior and the cause of perceived system slowness remain unverified."]
next_action = ["Capture a same-image runtime frequency/latency trace before changing CPU policy again."]
evidence = [
  { kind = "source", reference = "drivers/ArmCpu/ArmCpu.cpp", result = "ArmCpu startup and interrupt-controller implementation are present." },
  { kind = "device", reference = "docs/verification.md", command = "pull pmsg/pstore and inspect K1-K4, timer and IPI markers", revision = "d8def1ff64f9259a83cd37154eb5589a77dbb2f7", result = "Eight-core startup, timer and IPI activity were observed." },
]

[[area]]
id = "memory"
status = "device-verified"
components = ["RamBlock"]
paths = ["dts/rothko.dts", "drivers/NativeRamBlock/**", "configs/rothko_defconfig"]
inputs = ["MT6989 DRAM map, 8 GiB owned-memory target, XNU 4 KiB page tables, DMA ranges and the packed seed ramdisk.", "The 4 GiB and 8 GiB bootstrap/page-table observations from the K70U bring-up captures."]
configuration = ["payload.adt.owned_memory_size is 0x200000000 and the board DTS records the DRAM range.", "NativeRamBlock supplies the packed Data seed without making the UEFI firmware a persistent disk writer."]
procedure = ["Generate the board ADT, link the kernel and replay/observe the native 4 KiB bootstrap table construction before payload handoff.", "Check the seed hash and logical Data size against the recorded source artifact."]
findings = ["The 8 GiB bootstrap table pool was enlarged after a reproducible page-table boundary failure; the corrected path reached later XNU stages.", "The Data seed was imported in the root-matching captures; memory pressure and jetsam were still visible in earlier 2 GiB/4 GiB runs."]
completion = ["The declared memory and DMA regions are represented in ADT, page tables are built for the selected memory size and the packed seed imports with its recorded identity."]
limits = ["A complete long-duration memory-pressure comparison across 4 GiB and 8 GiB is not available; this area does not claim that RAM size alone fixes the UI stalls."]
next_action = ["Repeat a same-image 8 GiB run with persistent pmsg and memory-pressure counters if the device is recovered."]
evidence = [
  { kind = "source", reference = "dts/rothko.dts", result = "The board memory range and CPU/DMA-facing hardware record are source-controlled." },
  { kind = "device", reference = "docs/verification.md", command = "capture pmsg and inspect ADT/page-table and NativeRamBlock markers", revision = "d8def1ff64f9259a83cd37154eb5589a77dbb2f7", result = "The corrected bootstrap path and seed import reached later XNU stages on device captures." },
]

[[area]]
